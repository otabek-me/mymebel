{% load shop_extras %}
<article class="group overflow-hidden rounded-2xl border border-wood/10 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
    <a href="{% url 'shop:furniture_detail' item.slug %}" class="block">
        <div class="relative aspect-[4/3] overflow-hidden bg-sand">
            {% with image=item.get_main_image %}
                {% if image %}
                    <img src="{{ image.thumb_url }}" alt="{{ item.name }}" class="img-cover transition duration-500 group-hover:scale-105" loading="lazy">
                {% else %}
                    <div class="flex h-full items-center justify-center text-forest/30">
                        <svg class="h-14 w-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M5 10V6h14v4m-12 0v8m10-8v8M4 18h16"/></svg>
                    </div>
                {% endif %}
            {% endwith %}
            <span class="absolute left-3 top-3 rounded-full bg-white/90 px-3 py-1 text-xs font-semibold text-forest">{{ item.category.name }}</span>
        </div>
        <div class="p-4 sm:p-5">
            <h3 class="line-clamp-2 min-h-12 font-display text-lg font-semibold text-forest-dark">{{ item.name }}</h3>
            <p class="mt-2 text-sm text-forest-dark/55">{{ item.get_dimensions_display }}</p>
            <div class="mt-4 flex items-end justify-between gap-2">
                <p class="text-xs text-forest-dark/55">Boshlang'ich narx</p>
                <p class="text-right font-bold text-wood">{% if item.min_price %}{{ item.min_price|som }}{% else %}Narxni aniqlang{% endif %}</p>
            </div>
        </div>
    </a>
</article>
