{% extends 'panel/base.html' %}
{% block title %}Banner o'chirish{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl rounded-2xl border border-red-200 bg-white p-6 shadow-sm sm:p-9">
    <img src="{{ slide.image_medium.url }}" alt="" width="960" height="540" class="mb-6 aspect-video w-full rounded-xl object-cover">
    <p class="text-xs font-semibold uppercase tracking-[.16em] text-red-700">Tasdiqlash</p>
    <h1 class="mt-2 font-display text-2xl font-bold">«{{ slide.title }}» bannerini o'chirasizmi?</h1>
    <p class="mt-3 text-sm leading-6 text-forest-dark/60">Banner va unga tegishli desktop hamda mobil rasmlar o'chiriladi. Bu amalni qaytarib bo'lmaydi.</p>
    <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <a href="{% url 'panel:hero_slide_list' %}" class="inline-flex min-h-12 items-center justify-center rounded-xl border border-wood/20 px-5 font-semibold">Bekor qilish</a>
        <form method="post">{% csrf_token %}<button class="min-h-12 w-full rounded-xl bg-red-700 px-5 font-semibold text-white hover:bg-red-800 sm:w-auto">Ha, o'chirish</button></form>
    </div>
</div>
{% endblock %}
